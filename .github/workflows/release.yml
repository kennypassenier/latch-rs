name: Release

on:
  push:
    tags:
      - "v*.*.*"   # e.g. v0.2.0, v1.0.0-rc1

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # kennypassenier/latch-rs

permissions:
  contents: write          # create GitHub Release + upload assets
  packages: write          # push to GHCR

jobs:
  # ── Build release binaries for multiple platforms ────────────────────────────
  build-binaries:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: latch-linux-x86_64.tar.gz

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive: latch-linux-aarch64.tar.gz
            cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            archive: latch-macos-x86_64.tar.gz

          - os: macos-latest
            target: aarch64-apple-darwin
            archive: latch-macos-aarch64.tar.gz

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: latch-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Linux native build deps
      - name: Install Linux build deps
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev libdbus-1-dev libsecret-1-dev

      # Cross-compilation for aarch64-linux via cross
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary (native)
        if: "!matrix.cross"
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build release binary (cross)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      # ── Package ───────────────────────────────────────────────────────────────
      - name: Package (Unix tar.gz)
        if: runner.os != 'Windows'
        run: |
          BIN=target/${{ matrix.target }}/release/latch
          tar -czf ${{ matrix.archive }} -C $(dirname $BIN) $(basename $BIN)

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "target\${{ matrix.target }}\release\latch.exe"
          Compress-Archive -Path $bin -DestinationPath ${{ matrix.archive }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  # ── Create GitHub Release ────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Build and push Docker image to GHCR ─────────────────────────────────────
  docker:
    name: Docker → ghcr.io
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Generate OCI-standard labels + version tags:
      #   ghcr.io/kennypassenier/latch-rs:v0.2.0
      #   ghcr.io/kennypassenier/latch-rs:0.2.0
      #   ghcr.io/kennypassenier/latch-rs:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
