# CI gates (AR7): red blocks merge. Gates cover the v2 workspace crates;
# the legacy package is frozen reference (AR14) and deliberately ungated —
# its tests are environment-dependent (keyring) by v1 design.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt -p latch-core -p latch-cli -p latch-ui -- --check
      - name: clippy
        run: cargo clippy -p latch-core -p latch-cli -p latch-ui --all-targets -- -D warnings
      - name: test
        run: cargo test -p latch-core -p latch-cli -p latch-ui

  # AR17: the code must keep COMPILING for Windows on every push — this
  # catches a cfg-gating regression immediately instead of only at release
  # time. (Runtime behaviour on Windows is verified by Kenny per
  # docs/WINDOWS_TEST_CHECKLIST.md; CI only proves it builds.)
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
      - name: build for Windows
        run: cargo build -p latch-core -p latch-cli -p latch-ui

  # AR16: the pinned minimum supported Rust version must keep building —
  # a dependency bump that silently raises the bar fails here, not on a
  # machine with an older toolchain months later.
  msrv:
    runs-on: ubuntu-latest
    # rust-toolchain.toml pins the project to 1.97 and would silently
    # override the 1.86 installed below, turning this job into a second
    # copy of `gates`. RUSTUP_TOOLCHAIN outranks that file, so the MSRV
    # check keeps checking the MSRV.
    env:
      RUSTUP_TOOLCHAIN: "1.86"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86"
      - name: build with MSRV
        run: cargo build -p latch-core -p latch-cli -p latch-ui

  # Informational: measured line coverage per crate (gap 5 of the test
  # audit). Not a gate — the gates are the suites themselves — but the
  # number is visible on every run so drift is noticed.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97"
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: measure
        run: cargo llvm-cov -p latch-core -p latch-cli -p latch-ui --summary-only
