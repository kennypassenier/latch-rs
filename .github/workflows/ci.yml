# CI gates (AR7): red blocks merge. Gates cover the v2 workspace crates;
# the legacy package is frozen reference (AR14) and deliberately ungated —
# its tests are environment-dependent (keyring) by v1 design.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: fmt
        run: cargo fmt -p latch-core -p latch-cli -p latch-ui -- --check
      - name: clippy
        run: cargo clippy -p latch-core -p latch-cli -p latch-ui --all-targets -- -D warnings
      - name: test
        run: cargo test -p latch-core -p latch-cli -p latch-ui
