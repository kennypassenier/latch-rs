name: "Auto Tag Release"

'on':
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        shell: bash
        run: |
          cargo_version=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          latest_tag=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          latest_version=${latest_tag#v}

          if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$latest_tag" ]]; then
            next_version="$cargo_version"
          else
            highest=$(printf '%s\n%s\n' "$cargo_version" "$latest_version" | sort -V | tail -n1)
            if [[ "$highest" == "$cargo_version" && "$cargo_version" != "$latest_version" ]]; then
              next_version="$cargo_version"
            else
              IFS='.' read -r major minor patch <<< "$latest_version"
              next_version="$major.$minor.$((patch + 1))"
            fi
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "value=$next_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$next_version" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        if: steps.version.outputs.skip != 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"