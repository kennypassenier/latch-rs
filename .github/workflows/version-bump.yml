name: Version bump patch

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide whether to skip
        id: guard
        run: |
          if [[ "${{ github.actor }}" == "github-actions[bot]" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event.head_commit.message }}" == chore\(version\)\ bump\ patch* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Bump patch version in Cargo.toml
        if: steps.guard.outputs.skip != 'true'
        id: bump
        run: |
          old=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          IFS='.' read -r major minor patch <<< "$old"
          new="$major.$minor.$((patch + 1))"

          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$new\"/" Cargo.toml

          echo "old_version=$old" >> "$GITHUB_OUTPUT"
          echo "new_version=$new" >> "$GITHUB_OUTPUT"

      - name: Create version bump pull request
        if: steps.guard.outputs.skip != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: chore-version-bump-${{ steps.bump.outputs.new_version }}
          title: chore version bump to ${{ steps.bump.outputs.new_version }}
          body: |
            Automated patch version bump after merge to main.

            Previous version: `${{ steps.bump.outputs.old_version }}`
            New version: `${{ steps.bump.outputs.new_version }}`

            This PR exists so protected branch rules stay enforced while versioning remains automatic.
          branch: chore/version-bump/${{ github.run_id }}
          base: main
          delete-branch: true
