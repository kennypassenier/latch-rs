name: Version bump (patch)

on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-patch:
    # Do not create a new bump PR when the commit itself is already a version bump.
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(version): bump patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump patch version in Cargo.toml
        run: |
          old=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          IFS='.' read -r major minor patch <<< "$old"
          new="$major.$minor.$((patch + 1))"

          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"$new\"/" Cargo.toml

          echo "OLD_VERSION=$old" >> "$GITHUB_ENV"
          echo "NEW_VERSION=$new" >> "$GITHUB_ENV"

      - name: Create version bump pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: chore(version): bump patch ${{ env.OLD_VERSION }} -> ${{ env.NEW_VERSION }}
          title: chore(version): bump patch to ${{ env.NEW_VERSION }}
          body: |
            Automated patch version bump after merge to main.

            - Previous: `${{ env.OLD_VERSION }}`
            - New: `${{ env.NEW_VERSION }}`

            This PR exists so protected branch rules stay enforced while versioning remains automatic.
          branch: chore/version-bump/${{ github.run_id }}
          base: main
          delete-branch: true
