[package]
name = "latch-rs"
version = "0.1.4"
edition = "2024"
rust-version = "1.86"
description = "Encrypted .env secrets management backed by a private GitHub repository"
license = "AGPL-3.0-or-later"
repository = "https://github.com/kennypassenier/latch-rs"

[[bin]]
name = "latch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
keyring = "3"
dirs = "5"
anyhow = "1"
thiserror = "2"
dialoguer = "0.11"
indicatif = "0.17"
base64 = "0.22"
hex = "0.4"
ignore = "0.4"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }

[profile.release]
lto = true
strip = true

[lib]
name = "latch_rs"
path = "src/lib.rs"
